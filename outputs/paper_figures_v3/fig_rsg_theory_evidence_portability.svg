   <g id="text_1">
    <text style="font-weight: 700; font-size: 13px; font-family: 'Microsoft YaHei', 'Arial', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #20303c" x="16.431673" y="47.358474" transform="rotate(-0 16.431673 47.358474)">RSG-HRGV: theory properties and directly matched evidence</text>
   </g>
   <g id="text_2">
    <text style="font-size: 7.3px; font-family: 'Microsoft YaHei', 'Arial', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #647681" x="16.431673" y="63.206807" transform="rotate(-0 16.431673 63.206807)">The statements below characterize expert routing; they do not assert a universal classification gain.</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 9px; font-family: 'Microsoft YaHei', 'Arial', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #20303c" x="37.202939" y="104.43213" transform="rotate(-0 37.202939 104.43213)">Theorem B.1  Routing regret upper bound</text>
   </g>
   <g id="text_4">
    <text style="font-size: 7.1px; font-family: 'Microsoft YaHei', 'Arial', 'DejaVu Sans', sans-serif; fill: #20303c" transform="translate(37.202939 127.914139)">For a=p_d(y|x), b=p_m(y|x), g_o=I[a&gt;=b], and a,b&gt;=epsilon:</text>
    <text style="font-size: 7.1px; font-family: 'Microsoft YaHei', 'Arial', 'DejaVu Sans', sans-serif; fill: #20303c" transform="translate(37.202939 138.126283)">-log p_g(y|x) + log max(a,b) &lt;= |g-g_o| |a-b| / epsilon.</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 9px; font-family: 'Microsoft YaHei', 'Arial', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #20303c" x="37.202939" y="208.863986" transform="rotate(-0 37.202939 208.863986)">Theorem B.2  Soft-oracle approximation</text>
   </g>
   <g id="text_6">
    <text style="font-size: 7.1px; font-family: 'Microsoft YaHei', 'Arial', 'DejaVu Sans', sans-serif; fill: #20303c" transform="translate(37.202939 232.294234)">Delta=l_m-l_d,  g*=sigmoid(Delta/T_r).  The deviation from hard optimal routing</text>
    <text style="font-size: 7.1px; font-family: 'Microsoft YaHei', 'Arial', 'DejaVu Sans', sans-serif; fill: #20303c" transform="translate(37.202939 242.557963)">is bounded by exp(-|Delta|/T_r); small gaps retain uncertainty instead of forcing a switch.</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 9px; font-family: 'Microsoft YaHei', 'Arial', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #20303c" x="37.202939" y="313.29549" transform="rotate(-0 37.202939 313.29549)">Theorem B.3  Local gradient isolation</text>
   </g>
   <g id="text_8">
    <text style="font-size: 7.1px; font-family: 'Microsoft YaHei', 'Arial', 'DejaVu Sans', sans-serif; fill: #20303c" transform="translate(37.202939 336.777499)">L_reg=w BCE(g,g*),  w=tanh(|Delta|/T_w).  Applying stop-gradient to the regret branch</text>
    <text style="font-size: 7.1px; font-family: 'Microsoft YaHei', 'Arial', 'DejaVu Sans', sans-serif; fill: #20303c" transform="translate(37.202939 346.938057)">gives dL_reg/dtheta_e=0 for backbone and expert parameters through this branch.</text>
   </g>
   <g id="text_9">
    <text style="font-size: 7.5px; font-family: 'Microsoft YaHei', 'Arial', 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #20303c" x="233.376" y="409.161538" transform="rotate(-0 233.376 409.161538)">p_g=g p_d+(1-g)p_m,   g*=sigmoid((l_m-l_d)/T_r),   w=tanh(|l_m-l_d|/T_w)</text>
   </g>
  </g>
